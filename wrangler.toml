name = "daikin-one-constant-graph"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The ops endpoints need a public URL. Per-version preview URLs are off: they
# would keep every past version publicly reachable, and this project deploys
# straight to production rather than previewing versions first.
workers_dev = true
preview_urls = false

# Poll every 5 minutes. Daikin's documented floor is one request per 3 minutes;
# 5 leaves headroom for a retry without breaching it.
[triggers]
crons = ["*/5 * * * *"]

[vars]
CHANNEL_BASE = "1000"
POLL_INTERVAL_MIN = "5"
PUBLISH_BATCH = "200"
RAW_RETENTION_DAYS = "30"
DRY_RUN = "false"
# Electricity price per kWh for the cost column on /api/series. 0 disables it.
RATE_PER_KWH = "0.14"
CG_APP_NAME = "daikin-one-bridge"

# Duct sensors read back out of ConstantGraph. Node is the location the sensors
# publish to, which is not the location this bridge writes to. Set any channel
# to 0 to skip it.
CG_SENSOR_NODE = "1"
CG_CH_RETURN_TEMP = "124"
CG_CH_RETURN_RH = "125"
CG_CH_SUPPLY_TEMP = "39"

# AirGradient indoor air quality monitor. Location id from the AG dashboard;
# the token is a secret (wrangler secret put AG_TOKEN).
AG_LOCATION_ID = "183155"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   TURSO_DATABASE_URL       libsql://<db>-<org>.turso.io
#   TURSO_AUTH_TOKEN         from `turso db tokens create daikin`
#   DAIKIN_API_KEY           x-api-key from SkyportHome developer mode
#   DAIKIN_EMAIL             account email, used in the token request body
#   DAIKIN_INTEGRATOR_TOKEN  integrator token from home integration settings
#   CG_API_KEY               ConstantGraph API key
#   CG_READ_API_KEY          ConstantGraph *read* key, for the duct sensors
#   AG_TOKEN                 AirGradient place token, from app.airgradient.com/settings/place
#   READ_API_KEY             self-issued key guarding this Worker's own read API

# Retain Worker logs. Without this there is no record of why a cycle failed:
# the 2026-08-28 outage had to be diagnosed from gap boundaries and Grafana's
# alert history because nothing kept the exception. Free tier includes logs.
[observability]
enabled = true
head_sampling_rate = 1
